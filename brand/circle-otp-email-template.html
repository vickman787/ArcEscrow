<!--
  ArcEscrow — Circle OTP email template
  ==================================================================
  Paste into: Circle Developer Console
              Wallets > User Controlled > Configurator
              > Authentication Methods > Email > Email Template

  ------------------------------------------------------------------
  1. THE CODE PLACEHOLDER — this one breaks logins if you get it wrong
  ------------------------------------------------------------------
  {{VERIFICATION_CODE}} below is a STAND-IN, not a real Circle variable.
  Circle does not publish its variable names, so you must copy the exact
  token from Circle's own DEFAULT template (revert to default, copy the
  token that produces the code, then paste this template back with that
  token substituted). If you send with the stand-in still in place, users
  receive the literal text "{{VERIFICATION_CODE}}" and cannot log in.

  ------------------------------------------------------------------
  2. THE LOGO — must be deployed before it will appear
  ------------------------------------------------------------------
  Email clients cannot read local files and mostly block SVG, so the logo
  is referenced by absolute URL. That URL only exists once the site is
  deployed with public/arcescrow-email-logo.png. Until then the email
  shows a broken-image icon. Deploy first, confirm the URL loads in a
  browser, then save the template.

  ------------------------------------------------------------------
  3. WHY THIS USES bgcolor/align/font INSTEAD OF CSS
  ------------------------------------------------------------------
  Circle's editor strips style="..." attributes, so a CSS-styled template
  renders as unstyled text. This version carries its appearance in legacy
  presentational HTML attributes (bgcolor, align, width, cellpadding,
  <font>, <b>) which survive that stripping and are still the most widely
  supported styling in email clients. Inline styles are ALSO included as a
  progressive enhancement — if Circle stops stripping them the email gets
  rounded corners and better type, and if it keeps stripping them the
  attribute-based layout still holds up. Do not "modernise" this into
  flexbox/grid/<style> blocks: Gmail and Outlook strip those too.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f4f0">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td height="32" style="height:32px;font-size:0;line-height:0;">&nbsp;</td></tr>
      </table>

      <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff"
             style="max-width:520px;border:1px solid #e4e2da;border-radius:12px;">

        <!-- Logo -->
        <tr>
          <td align="left" width="520" style="padding:32px 32px 20px 32px;">
            <table role="presentation" cellpadding="10" cellspacing="0" border="0">
              <tr>
                <td style="padding:32px 0 0 32px;">
                  <img src="https://arcescrow.xyz/arcescrow-email-logo.png"
                       alt="ArcEscrow" width="200" height="49" border="0"
                       style="display:block;width:200px;height:auto;border:0;outline:none;text-decoration:none;" />
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Heading -->
        <tr>
          <td align="left" style="padding:0 32px 6px 32px;">
            <table role="presentation" cellpadding="10" cellspacing="0" border="0" width="100%">
              <tr>
                <td align="left" style="padding:0 32px 0 32px;">
                  <font face="Helvetica, Arial, sans-serif" color="#181614" size="5">
                    <b style="font-size:24px;line-height:1.3;">Log in to ArcEscrow</b>
                  </font>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Intro -->
        <tr>
          <td align="left" style="padding:0 32px 20px 32px;">
            <table role="presentation" cellpadding="10" cellspacing="0" border="0" width="100%">
              <tr>
                <td align="left" style="padding:8px 32px 0 32px;">
                  <font face="Helvetica, Arial, sans-serif" color="#565049" size="3">
                    <span style="font-size:15px;line-height:1.6;">Enter this code in ArcEscrow to finish signing in.</span>
                  </font>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Code -->
        <tr>
          <td align="center" style="padding:0 32px 20px 32px;">
            <table role="presentation" width="440" cellpadding="16" cellspacing="0" border="0" bgcolor="#f4f6fd"
                   style="border:1px solid #d5deF6;border-radius:10px;">
              <tr>
                <td align="center" bgcolor="#f4f6fd" style="border-radius:10px;">
                  <font face="Courier New, Courier, monospace" color="#2451c4" size="6">
                    <b style="font-size:30px;letter-spacing:0.10em;">{{VERIFICATION_CODE}}</b>
                  </font>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Expiry -->
        <tr>
          <td align="left" style="padding:0 32px 24px 32px;">
            <table role="presentation" cellpadding="10" cellspacing="0" border="0" width="100%">
              <tr>
                <td align="left" style="padding:0 32px 8px 32px;">
                  <font face="Helvetica, Arial, sans-serif" color="#565049" size="2">
                    <span style="font-size:14px;line-height:1.6;">This code expires in 10 minutes. If you didn&rsquo;t request it, you can safely ignore this email &mdash; no one can access your wallet without it.</span>
                  </font>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Divider -->
        <tr>
          <td align="center" style="padding:0 32px;">
            <table role="presentation" width="440" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td>
                  <hr noshade size="1" color="#e4e2da"
                      style="border:0;border-top:1px solid #e4e2da;margin:0;height:1px;" />
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td align="left" style="padding:16px 32px 28px 32px;">
            <table role="presentation" cellpadding="10" cellspacing="0" border="0" width="100%">
              <tr>
                <td align="left" style="padding:16px 32px 24px 32px;">
                  <font face="Helvetica, Arial, sans-serif" color="#8b857b" size="2">
                    <span style="font-size:13px;line-height:1.6;">ArcEscrow &mdash; escrow on Arc Network, settled in USDC.</span><br />
                    <a href="https://arcescrow.xyz" style="color:#2451c4;text-decoration:none;"><font color="#2451c4">arcescrow.xyz</font></a>
                  </font>
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td height="32" style="height:32px;font-size:0;line-height:0;">&nbsp;</td></tr>
      </table>
    </td>
  </tr>
</table>
